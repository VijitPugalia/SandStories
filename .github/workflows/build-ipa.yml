name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration passed to xtool
        required: false
        default: release
        type: choice
        options:
          - release
          - debug

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode SDK
        run: |
          sw_vers
          xcodebuild -version
          xcrun -sdk iphoneos -show-sdk-path
          swift --version

      - name: Install xtool
        run: bash scripts/ci-setup-xtool-macos.sh

      - name: Verify xtool on PATH
        run: which xtool && xtool --version

      - name: Build release IPA
        run: bash scripts/build_release_ipa.sh "${{ inputs.configuration || 'release' }}"

      - name: List build outputs
        if: always()
        run: |
          find xtool -maxdepth 2 -print || true
          du -h xtool/SandStories.ipa || true

      - name: Upload IPA artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SandStories-ipa
          path: |
            xtool/SandStories.ipa
            xtool/SandStories.app
          retention-days: 30

      - name: Upload IPA artifact (PR preview)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SandStories-ipa-pr-${{ github.event.pull_request.number }}
          path: |
            xtool/SandStories.ipa
            xtool/SandStories.app
          retention-days: 7
