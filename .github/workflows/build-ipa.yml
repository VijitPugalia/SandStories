name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration passed to xtool
        required: false
        default: release
        type: choice
        options:
          - release
          - debug

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode SDK
        run: |
          sw_vers
          xcodebuild -version
          xcrun -sdk iphoneos -show-sdk-path
          swift --version

      - name: Install xtool
        run: bash scripts/ci-setup-xtool-macos.sh

      - name: Verify xtool on PATH
        run: which xtool && xtool --version

      - name: Build release IPA
        run: bash scripts/build_release_ipa.sh "${{ inputs.configuration || 'release' }}"

      - name: List build outputs
        if: always()
        run: |
          find xtool -maxdepth 2 -print || true
          du -h xtool/SandStories.ipa || true

      - name: Upload IPA artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SandStories-ipa
          path: |
            xtool/SandStories.ipa
            xtool/SandStories.app
          retention-days: 30

      - name: Publish latest IPA release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: latest-ipa
          IPA_PATH: xtool/SandStories.ipa
          IPA_URL: https://github.com/${{ github.repository }}/releases/download/latest-ipa/SandStories.ipa
        run: |
          set -euo pipefail

          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG" --force

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Latest SandStories IPA" \
              --notes "Rolling latest private IPA build from main. Commit: $GITHUB_SHA"
          else
            gh release create "$RELEASE_TAG" \
              --title "Latest SandStories IPA" \
              --notes "Rolling latest private IPA build from main. Commit: $GITHUB_SHA"
          fi

          gh release upload "$RELEASE_TAG" "$IPA_PATH#SandStories.ipa" --clobber

          {
            echo "### Latest private IPA"
            echo ""
            echo "[Download SandStories.ipa]($IPA_URL)"
            echo ""
            echo "Open this link from iPhone Safari while logged into GitHub, then import the IPA into LiveContainer or SideStore."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact (PR preview)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SandStories-ipa-pr-${{ github.event.pull_request.number }}
          path: |
            xtool/SandStories.ipa
            xtool/SandStories.app
          retention-days: 7
