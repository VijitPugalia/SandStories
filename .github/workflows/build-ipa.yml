name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode SDK
        run: xcrun -sdk iphoneos -show-sdk-path

      - name: Install xtool
        run: bash scripts/ci-setup-xtool-macos.sh

      - name: Build release IPA
        run: bash scripts/build_release_ipa.sh

      - name: Upload IPA artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SandStories-ipa
          path: xtool/SandStories.ipa
          retention-days: 30

      - name: Upload IPA artifact (PR preview)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SandStories-ipa-pr-${{ github.event.pull_request.number }}
          path: xtool/SandStories.ipa
          retention-days: 7
