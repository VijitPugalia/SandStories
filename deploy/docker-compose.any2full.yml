services:
  livekit:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.livekit
    image: sandstories-livekit:local
    restart: unless-stopped
    volumes: !reset []
    network_mode: bridge
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  field-console:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.field-console-any2full
    image: sandstories-field-console-any2full:local
    restart: unless-stopped
    command: uvicorn server.app:app --host 0.0.0.0 --port 8080
    network_mode: bridge
    ports:
      - "8080:8080"
    environment:
      SANDSTORIES_ANY2FULL_ENABLED: "true"
      SANDSTORIES_ANY2FULL_PYTHON: /opt/conda/envs/sandstories/bin/python
      SANDSTORIES_ANY2FULL_DIR: /opt/any2full
      SANDSTORIES_ANY2FULL_CHECKPOINT: /opt/any2full-checkpoints/${ANY2FULL_CHECKPOINT_FILE:-Any2Full_vits.pth.tar}
      SANDSTORIES_ANY2FULL_ENCODER: ${SANDSTORIES_ANY2FULL_ENCODER:-auto}
      SANDSTORIES_ANY2FULL_DEPTH_SOURCE: ${SANDSTORIES_ANY2FULL_DEPTH_SOURCE:-selected}
      SANDSTORIES_ANY2FULL_TARGET_RESOLUTION: ${SANDSTORIES_ANY2FULL_TARGET_RESOLUTION:-depth}
      SANDSTORIES_ANY2FULL_STRIDE: ${SANDSTORIES_ANY2FULL_STRIDE:-10}
      SANDSTORIES_ANY2FULL_MAX_FRAMES: ${SANDSTORIES_ANY2FULL_MAX_FRAMES:-60}
      SANDSTORIES_ANY2FULL_DENOISE: ${SANDSTORIES_ANY2FULL_DENOISE:-false}
      SANDSTORIES_ANY2FULL_TIMEOUT_SECONDS: ${SANDSTORIES_ANY2FULL_TIMEOUT_SECONDS:-3600}
    volumes: !override
      - server_data:/app/server_data
      - ${ANY2FULL_HOST_DIR:?Set ANY2FULL_HOST_DIR to the Any2Full checkout}:/opt/any2full:ro
      - ${ANY2FULL_CHECKPOINT_HOST_DIR:?Set ANY2FULL_CHECKPOINT_HOST_DIR to the checkpoint directory}:/opt/any2full-checkpoints:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  server_data:
